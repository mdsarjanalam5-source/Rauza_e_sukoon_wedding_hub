
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/extracted"
          mkdir -p "$EXTRACT_DIR"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f -iname '*.zip' \
            ! -path '*/.git/*' \
            ! -path '*/.github/*' \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"
            SEARCH_DIR="$EXTRACT_DIR"
          else
            echo "No ZIP found; checking repository files."
            SEARCH_DIR="$GITHUB_WORKSPACE"
          fi

          PROJECT_FILE=$(find "$SEARCH_DIR" \
            -type f \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            ! -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::No Android Gradle project found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align JVM Targets
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "::error::app/build.gradle.kts not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'(\bjvmTarget\s*=\s*)["\'](?:1\.)?\d+["\']',
              r'\1"17"',
              text
          )

          text = re.sub(
              r'(\b(?:sourceCompatibility|targetCompatibility)\s*=\s*)JavaVersion\.VERSION_\w+',
              r'\1JavaVersion.VERSION_17',
              text
          )

          text = re.sub(
              r'\bJvmTarget\.JVM_(?:1_\d+|\d+)\b',
              'JvmTarget.JVM_17',
              text
          )

          path.write_text(text)
          print("Aligned explicit Java/Kotlin JVM targets where configured.")
          PY

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" \
            -Pkotlin.jvm.target.validation.mode=warning \
            assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rauza-e-Sukoon-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
