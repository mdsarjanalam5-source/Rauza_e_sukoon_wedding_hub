
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/extracted"
          mkdir -p "$EXTRACT_DIR"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f -iname '*.zip' \
            ! -path '*/.git/*' \
            ! -path '*/.github/*' \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"
            SEARCH_DIR="$EXTRACT_DIR"
          else
            SEARCH_DIR="$GITHUB_WORKSPACE"
          fi

          SETTINGS=$(find "$SEARCH_DIR" -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            ! -path '*/.gradle/*' -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          else
            MODULE=$(find "$SEARCH_DIR" -type f \
              \( -path '*/app/build.gradle' \
              -o -path '*/app/build.gradle.kts' \) \
              -print -quit)

            if [ -z "$MODULE" ]; then
              echo "::error::Android Gradle project not found."
              find "$SEARCH_DIR" -maxdepth 4 -type f \
                \( -name '*.gradle' -o -name '*.gradle.kts' \)
              exit 1
            fi

            PROJECT_DIR="$(dirname "$(dirname "$MODULE")")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Module
        shell: bash
        run: |
          set -euo pipefail

          MODULE=$(find "$PROJECT_DIR" -type f \
            \( -path '*/app/build.gradle.kts' \
            -o -path '*/app/build.gradle' \) \
            ! -path '*/.gradle/*' -print -quit)

          if [ -z "$MODULE" ]; then
            echo "::error::No app/build.gradle or app/build.gradle.kts found."
            echo "Gradle files present:"
            find "$PROJECT_DIR" -maxdepth 5 -type f \
              \( -name '*.gradle' -o -name '*.gradle.kts' \)
            exit 1
          fi

          echo "MODULE_FILE=$MODULE" >> "$GITHUB_ENV"
          echo "Android module: $MODULE"

      - name: Align JVM Targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$MODULE_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'(\bjvmTarget\s*=\s*)["\'](?:1\.)?\d+["\']',
              r'\1"17"',
              s
          )

          s = re.sub(
              r'\bJvmTarget\.JVM_(?:1_\d+|\d+)\b',
              'JvmTarget.JVM_17',
              s
          )

          s = re.sub(
              r'((?:sourceCompatibility|targetCompatibility)\s*=\s*)JavaVersion\.VERSION_\w+',
              r'\1JavaVersion.VERSION_17',
              s
          )

          p.write_text(s)
          print("Checked JVM target settings in", p.name)
          PY

      - name: Build Debug APK
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" \
            -Pkotlin.jvm.target.validation.mode=warning \
            assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rauza-e-Sukoon-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
